apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: docket-gateway
  namespace: docket
  labels:
    app.kubernetes.io/name: docket-gateway
    app.kubernetes.io/part-of: docket
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  addresses:
    - type: NamedAddress
      value: docket-ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docket-routes
  namespace: docket
  labels:
    app.kubernetes.io/name: docket-routes
    app.kubernetes.io/part-of: docket
spec:
  parentRefs:
    - name: docket-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
