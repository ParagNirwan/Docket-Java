name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]


jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: app/target/surefire-reports/


  frontend:
    name: Frontend - Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test


  ai-evaluation:
    name: AI Search Quality Evaluation
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: docketdb
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket -d docketdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application (skip tests, already done in backend job)
        run: mvn clean package -DskipTests

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U docket -d docketdb; then
              echo "Database ready"
              break
            fi
            sleep 2
          done

      - name: Run Flyway migrations
        run: mvn flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/docketdb -Dflyway.user=docket -Dflyway.password=docket_dev_password

      - name: Create evaluation tenant and load test documents
        run: |
          cat << 'EOF' > setup-eval.sql
          -- Create test tenant
          INSERT INTO tenants (id, name, slug, status, created_at, owner_id)
          VALUES ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'Evaluation Tenant', 'eval-tenant', 'ACTIVE', now(), 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb')
          ON CONFLICT (id) DO NOTHING;

          -- Create test user
          INSERT INTO users (id, name, email, password_hash, email_verified_at, token_version, created_at)
          VALUES ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'Eval User', 'eval-user@example.com', 'hash', now(), 1, now())
          ON CONFLICT (id) DO NOTHING;

          -- Create membership
          INSERT INTO memberships (tenant_id, user_id, role, status, created_at)
          VALUES ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'OWNER', 'ACTIVE', now())
          ON CONFLICT (tenant_id, user_id) DO NOTHING;

          -- Create tray
          INSERT INTO folders (id, tenant_id, name, parent_id, created_by, created_at)
          VALUES ('cccccccc-cccc-cccc-cccc-cccccccccccc', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'Legal', null, 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', now())
          ON CONFLICT (id) DO NOTHING;

          -- Create test documents with known content
          INSERT INTO documents (id, tenant_id, folder_id, original_file_name, stored_file_name, content_type, file_size, file_status, indexing_status, uploaded_by, created_at)
          VALUES
            ('dddddddd-dddd-dddd-dddd-dddddddddddd', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 'lease-agreement.pdf', 'lease.pdf', 'application/pdf', 1000, 'ACTIVE', 'COMPLETED', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', now()),
            ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 'invoice-2024-001.pdf', 'invoice.pdf', 'application/pdf', 1000, 'ACTIVE', 'COMPLETED', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', now()),
            ('ffffffff-ffff-ffff-ffff-ffffffffffff', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 'nda-acme-beta.pdf', 'nda.pdf', 'application/pdf', 1000, 'ACTIVE', 'COMPLETED', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', now()),
            ('11111111-1111-1111-1111-111111111111', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 'service-agreement.pdf', 'service.pdf', 'application/pdf', 1000, 'ACTIVE', 'COMPLETED', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', now())
          ON CONFLICT (id) DO NOTHING;

          -- Create document chunks with known text for evaluation
          INSERT INTO document_chunks (id, tenant_id, document_id, chunk_index, chunk_text, page_start, page_end, heading, char_start, char_end, embedding, embedding_version)
          VALUES
            -- lease-agreement chunks
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 0, 'LEASE AGREEMENT Between Landlord and Tenant', 1, 1, 'Header', 0, 50, ARRAY[0.1,0.2]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 1, 'Term: January 1, 2024 to December 31, 2026', 1, 1, 'Term', 50, 100, ARRAY[0.15,0.25]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 2, 'Renewal: Tenant has one 5-year renewal option with 6 months written notice. Rent increases 3% annually.', 2, 2, 'Renewal', 100, 200, ARRAY[0.2,0.3]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 3, 'Termination: Either party may terminate with 60 days written notice. Early termination by tenant requires payment of 2 months rent as penalty.', 2, 2, 'Termination', 200, 350, ARRAY[0.3,0.4]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 4, 'Insurance: Tenant must maintain general liability insurance of $1,000,000 per occurrence and $2,000,000 aggregate.', 3, 3, 'Insurance', 350, 450, ARRAY[0.25,0.35]::vector(2), 1),
            -- invoice chunks
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee', 0, 'INVOICE INV-2024-001', 1, 1, 'Header', 0, 30, ARRAY[0.1,0.2]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee', 1, 'Payment Terms: Net 30 days from invoice date. Late payments incur 1.5% monthly interest.', 1, 1, 'Payment Terms', 30, 120, ARRAY[0.4,0.3]::vector(2), 1),
            -- NDA chunks
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'ffffffff-ffff-ffff-ffff-ffffffffffff', 0, 'NON-DISCLOSURE AGREEMENT Between Acme Corporation (Disclosing Party) and Beta LLC (Receiving Party)', 1, 1, 'Parties', 0, 100, ARRAY[0.5,0.1]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'ffffffff-ffff-ffff-ffff-ffffffffffff', 1, 'Confidential Information includes all trade secrets, business plans, and technical data.', 1, 1, 'Definition', 100, 200, ARRAY[0.45,0.15]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'ffffffff-ffff-ffff-ffff-ffffffffffff', 2, 'Confidentiality obligations survive for 5 years from the date of disclosure.', 2, 2, 'Term', 200, 300, ARRAY[0.4,0.2]::vector(2), 1),
            -- service agreement chunks
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '11111111-1111-1111-1111-111111111111', 0, 'SERVICE AGREEMENT', 1, 1, 'Header', 0, 20, ARRAY[0.3,0.3]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '11111111-1111-1111-1111-111111111111', 4, 'Limitation of Liability: Total liability capped at total fees paid in 12 months preceding the claim.', 3, 3, 'Liability', 200, 300, ARRAY[0.35,0.25]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '11111111-1111-1111-1111-111111111111', 5, 'Governing Law: This agreement governed by laws of the State of Delaware.', 3, 3, 'Governing Law', 300, 400, ARRAY[0.3,0.4]::vector(2), 1),
            (gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', '11111111-1111-1111-1111-111111111111', 6, 'Force Majeure: Neither party liable for delays caused by events beyond reasonable control including natural disasters, war, strikes, or government actions.', 4, 4, 'Force Majeure', 400, 550, ARRAY[0.25,0.45]::vector(2), 1)
          ON CONFLICT (id) DO NOTHING;
          EOF
          psql -h localhost -p 5432 -U docket -d docketdb -f setup-eval.sql

      - name: Run AI Search Evaluation
        env:
          SPRING_PROFILES_ACTIVE: gcp
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AI_EVALUATION_ENABLED: true
          AI_EVALUATION_DATASET: legal
          AI_EVALUATION_TENANT_ID: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
          AI_EVALUATION_USER: eval-user@example.com
          AI_EVAL_MIN_CITATION_PRECISION: 0.5
          AI_EVAL_MIN_CITATION_RECALL: 0.5
          AI_EVAL_MIN_ANSWER_CORRECTNESS: 0.4
          AI_EVAL_FAIL_ON_REGRESSION: true
          GCP_PROJECT_ID: test-project
        run: |
          # Run the evaluation via spring boot
          java -jar target/*.jar \
            --docket.ai.evaluation.enabled=true \
            --docket.ai.evaluation.dataset=legal \
            --docket.ai.evaluation.tenant-id=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa \
            --docket.ai.evaluation.user=eval-user@example.com \
            --docket.ai.evaluation.min-citation-precision=0.5 \
            --docket.ai.evaluation.min-citation-recall=0.5 \
            --docket.ai.evaluation.min-answer-correctness=0.4 \
            --docket.ai.evaluation.fail-on-regression=true \
            --spring.main.web-application-type=none \
            --spring.jpa.hibernate.ddl-auto=none
