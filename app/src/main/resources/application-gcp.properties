# GCP profile: activated with SPRING_PROFILES_ACTIVE=gcp

# Cloud SQL connection (will be set via environment variables in Kubernetes)
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# GCS bucket for file uploads
docket.storage.gcs.bucket=docket-java-uploads

# Production logging
logging.level.root=WARN
logging.level.com.docket=INFO

# Data residency + CMEK (docs/data-residency.md). EU is the default region; leaving the US
# bucket blank makes US organizations' uploads fail rather than land in the EU.
docket.storage.gcs.bucket-us=${GCS_BUCKET_US:}
docket.storage.gcs.kms-key-eu=${GCS_KMS_KEY_EU:}
docket.storage.gcs.kms-key-us=${GCS_KMS_KEY_US:}
