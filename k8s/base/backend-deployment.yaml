apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docket
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: docket
    spec:
      serviceAccountName: docket-backend
      containers:
        # --- Main application container ---
        - name: backend
          image: europe-west3-docker.pkg.dev/docket-java/docket/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          command: ["sh", "-c"]
          args:
            - |
              export JWT_SECRET=$(tr -d '\r\n' < /mnt/secrets/JWT_SECRET)
              export SPRING_DATASOURCE_PASSWORD=$(tr -d '\r\n' < /mnt/secrets/SPRING_DATASOURCE_PASSWORD)
              exec java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar app.jar
          envFrom:
            - configMapRef:
                name: docket-config
          resources:
            requests:
              memory: "1536Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true

        # --- Cloud SQL Auth Proxy sidecar ---
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--structured-logs"
            - "docket-java:europe-west3:docket-db"
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: docket-secrets-provider
