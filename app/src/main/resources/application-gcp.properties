# GCP profile: activated with SPRING_PROFILES_ACTIVE=gcp

# Cloud SQL connection (will be set via environment variables in Kubernetes)
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# GCS bucket for file uploads
docket.storage.gcs.bucket=docket-java-uploads

# Production logging
logging.level.root=WARN
logging.level.com.docket=INFO
