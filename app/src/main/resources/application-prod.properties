# Production profile: activated with SPRING_PROFILES_ACTIVE=prod

# Flyway manages schema migrations — never let Hibernate auto-modify the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway is enabled by default via classpath, but be explicit
spring.flyway.enabled=true

# Production logging: less noise, more signal
logging.level.root=WARN
logging.level.com.docket=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# No local defaults in production: startup fails if these are missing
docket.app.base-url=${APP_BASE_URL}
docket.email.from=${EMAIL_FROM}
docket.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
docket.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_BASE_URL}}
