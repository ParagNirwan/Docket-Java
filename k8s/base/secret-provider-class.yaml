apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: docket-secrets-provider
  namespace: docket
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/docket-java/secrets/jwt-secret/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/docket-java/secrets/spring-datasource-password/versions/latest"
        path: "SPRING_DATASOURCE_PASSWORD"
  secretObjects:
    - secretName: docket-secrets
      type: Opaque
      data:
        - objectName: "JWT_SECRET"
          key: JWT_SECRET
        - objectName: "SPRING_DATASOURCE_PASSWORD"
          key: SPRING_DATASOURCE_PASSWORD
