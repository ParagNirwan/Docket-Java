<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="margin:0;padding:24px;background:#f9fafb;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
<tr><td style="padding:32px;font-size:15px;line-height:1.6;">
<p style="margin:0 0 24px;font-size:18px;font-weight:bold;">Docket</p>
<p th:text="${message}"></p>
<p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;padding:10px 20px;background:#4f46e5;color:#ffffff;text-decoration:none;border-radius:8px;">Open Docket</a></p>
<p style="font-size:13px;color:#6b7280;">Or paste this link into your browser:<br><span th:text="${link}"></span></p>
</td></tr>
</table>
</body>
</html>
