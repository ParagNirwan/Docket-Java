apiVersion: v1
kind: ConfigMap
metadata:
  name: docket-config
  namespace: docket
data:
  SPRING_PROFILES_ACTIVE: "prod,gcp"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/docketdb"
  SPRING_DATASOURCE_USERNAME: "docket"
  GCP_PROJECT_ID: "docket-java"
  GCP_LOCATION: "europe-west3"
  DOCKET_STORAGE_TYPE: "gcs"
  DOCKET_STORAGE_GCS_BUCKET: "docket-java-uploads"
  # No email is sent yet. See docs/email.md to turn it on.
  EMAIL_PROVIDER: "disabled"
  EMAIL_FROM: "Docket <onboarding@resend.dev>"
  # Change to the real domain when there is one. Used for email links and CORS.
  APP_BASE_URL: "http://136.82.179.212"
  # The Google load balancer appends "client, load balancer" to X-Forwarded-For
  TRUSTED_PROXY_HOPS: "2"
  # The gateway only serves plain HTTP today, and browsers discard Secure cookies over
  # HTTP. Remove this line as soon as HTTPS is on: production then defaults to Secure.
  AUTH_COOKIE_SECURE: "false"
