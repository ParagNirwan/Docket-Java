spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/docketdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:docket_dev_password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update 
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
docket.storage.local.root-dir=./uploads