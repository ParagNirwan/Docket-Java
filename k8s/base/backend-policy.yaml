# The load balancer ends any response that takes longer than its backend timeout, which is
# 30 seconds unless set here. A streamed AI answer, or a long summary, can take longer.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: backend-policy
  namespace: docket
  labels:
    app.kubernetes.io/name: backend-policy
    app.kubernetes.io/part-of: docket
spec:
  default:
    timeoutSec: 300
  targetRef:
    group: ""
    kind: Service
    name: backend
