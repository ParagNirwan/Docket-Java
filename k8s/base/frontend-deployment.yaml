apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docket
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: docket
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: docket
    spec:
      containers:
        - name: frontend
          image: europe-west3-docker.pkg.dev/docket-java/docket/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3
