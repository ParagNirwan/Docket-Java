apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docket-ingress
  namespace: docket
  labels:
    app.kubernetes.io/name: docket-ingress
    app.kubernetes.io/part-of: docket
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "docket-ip"
spec:
  ingressClassName: gce
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
