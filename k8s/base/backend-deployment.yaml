apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docket
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docket
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: docket
    spec:
      serviceAccountName: docket-backend
      containers:
        # --- Main application container ---
        - name: backend
          image: europe-west3-docker.pkg.dev/docket-java/docket/backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: docket-config
            - secretRef:
                name: docket-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

        # --- Cloud SQL Auth Proxy sidecar ---
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--structured-logs"
            - "docket-java:europe-west3:docket-db"
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true
