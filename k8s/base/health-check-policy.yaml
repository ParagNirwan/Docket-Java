apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: backend-health-check
  namespace: docket
  labels:
    app.kubernetes.io/name: backend-health-check
    app.kubernetes.io/part-of: docket
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /actuator/health/readiness
  targetRef:
    group: ""
    kind: Service
    name: backend
