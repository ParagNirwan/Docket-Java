spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/docketdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:docket_dev_password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
docket.storage.local.root-dir=./uploads

# GCP / Vertex AI
gcp.project-id=${GCP_PROJECT_ID}
gcp.location=${GCP_LOCATION:europe-west3}
docket.ai.embedding.model=text-embedding-005
docket.ai.embedding.dimensions=768
docket.ai.chunk.size=2000
docket.ai.chunk.overlap=200
docket.ai.gemini.model=gemini-3.5-flash-lite
# Used for small jobs such as rewriting follow-up questions
docket.ai.gemini.rewrite-model=gemini-3.5-flash-lite

# Raise the version to re-index every document. See docs/ai-search.md
docket.ai.embedding.version=1
docket.scanner.callback-token=${SCANNER_CALLBACK_TOKEN:}
docket.ai.reindex.enabled=${AI_REINDEX_ENABLED:true}
docket.ai.reindex.batch-size=10
docket.ai.reindex.interval-ms=60000
docket.ai.reindex.max-attempts=3

# Retrieval: cosine distance runs from 0 (same meaning) to 2 (opposite meaning)
docket.ai.retrieval.max-distance=${AI_RETRIEVAL_MAX_DISTANCE:0.45}
# When nothing passes max-distance, keep the best min-results chunks within this looser bound
docket.ai.retrieval.fallback-max-distance=${AI_RETRIEVAL_FALLBACK_MAX_DISTANCE:0.6}
docket.ai.retrieval.min-results=1
docket.ai.retrieval.hybrid=${AI_RETRIEVAL_HYBRID:true}

# Text extraction and OCR
docket.ai.extraction.max-chars=2000000
docket.ai.ocr.endpoint=${AI_OCR_ENDPOINT:vision.googleapis.com:443}
docket.ai.ocr.max-pages=${AI_OCR_MAX_PAGES:200}
docket.ai.ocr.min-chars-per-page=50
docket.ai.ocr.timeout-minutes=10

# Optional AI-written context for each chunk. Costs one model call per chunk.
docket.ai.enrichment.llm-context.enabled=${AI_LLM_CHUNK_CONTEXT_ENABLED:false}
docket.ai.enrichment.llm-context.max-document-chars=40000

# Async thread pool for document processing
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
# A re-index batch can take minutes. Other scheduled jobs, such as email, must not wait for it.
spring.task.scheduling.pool.size=3

# Sessions
docket.auth.refresh-ttl-days=14
docket.auth.refresh-reuse-grace-seconds=10
docket.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# How many proxies sit in front of the backend and append to X-Forwarded-For.
# 0 = connected directly, 1 = nginx, 2 = Google load balancer.
docket.security.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:0}
docket.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# Single sign-on providers. Leave empty to disable a provider until the client id/secret are configured.
docket.sso.google.client-id=${GOOGLE_CLIENT_ID:}
docket.sso.google.client-secret=${GOOGLE_CLIENT_SECRET:}
docket.sso.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/sso/callback}
docket.sso.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
docket.sso.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
docket.sso.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:5173/auth/sso/callback}

# Public URL of the frontend, used for links in emails
docket.app.base-url=${APP_BASE_URL:http://localhost:5173}

# Invites
docket.invitations.ttl-days=${INVITATION_TTL_DAYS:7}
docket.invitations.limit-per-hour=${INVITATION_LIMIT_PER_HOUR:50}

# Retention and trash. Each job runs on one pod per schedule, in the server's time zone.
docket.retention.expiry-cron=${RETENTION_EXPIRY_CRON:0 30 2 * * *}
docket.retention.trash-purge-cron=${TRASH_PURGE_CRON:0 0 4 * * *}
docket.retention.batch-size=200
docket.notifications.digest-cron=${NOTIFICATION_DIGEST_CRON:0 0 7 * * *}

# Email: logging (local only), smtp, resend or disabled
docket.email.provider=${EMAIL_PROVIDER:logging}
docket.email.from=${EMAIL_FROM:Docket <no-reply@docket.local>}
docket.email.resend.api-key=${RESEND_API_KEY:}
docket.email.verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# Email is retried from the outbox, so a mail outage must not mark the app as unhealthy.
# It would also probe SMTP when the provider is resend, where no SMTP server exists.
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true

# Audit log: anything below 365 days is raised to 365
docket.audit.retention-days=${AUDIT_RETENTION_DAYS:365}

# Re-ranking with the Vertex AI Ranking API. Off until the API is enabled: see docs/ai-search.md
docket.ai.rerank.enabled=${AI_RERANK_ENABLED:false}
docket.ai.rerank.model=${AI_RERANK_MODEL:semantic-ranker-default@latest}
# "global", or "eu" / "us" to keep ranking requests in that region
docket.ai.rerank.location=${AI_RERANK_LOCATION:global}
# Past this the answer goes ahead in retrieval order
docket.ai.rerank.timeout-ms=500
docket.ai.rerank.max-candidates=30
# A re-ranked chunk below this score (0 to 1) is dropped. A starting point, not a measured value.
docket.ai.rerank.min-score=${AI_RERANK_MIN_SCORE:0.3}

# AI summary of each document, written after indexing. Organizations can also turn it off themselves.
docket.ai.summary.enabled=${AI_SUMMARIES_ENABLED:true}

# Authentication & Security Limits
docket.auth.login-limit-per-ip=${AUTH_LOGIN_LIMIT_PER_IP:20}
docket.auth.login-limit-per-account=${AUTH_LOGIN_LIMIT_PER_ACCOUNT:5}
docket.auth.lockout-failures=${AUTH_LOCKOUT_FAILURES:10}
docket.auth.lockout-window-minutes=${AUTH_LOCKOUT_WINDOW_MINUTES:15}

# Bulk Operations Limits
docket.bulk.max-rows=${BULK_INVITE_MAX_ROWS:200}
docket.bulk.max-csv-length=${BULK_INVITE_MAX_CSV_LENGTH:100000}
docket.bulk.invite-limit-per-hour=${BULK_INVITE_LIMIT_PER_HOUR:5}

# AI Pipeline Thresholds & Limits
docket.ai.conversation.history-messages=${AI_CONVERSATION_HISTORY_MESSAGES:6}
docket.ai.conversation.max-history-message-length=${AI_CONVERSATION_MAX_HISTORY_MESSAGE_LENGTH:1000}
docket.ai.query.top-k-specific=${AI_QUERY_TOP_K_SPECIFIC:5}
docket.ai.query.top-k-broad=${AI_QUERY_TOP_K_BROAD:200}
docket.ai.query.summary-map-group-size=${AI_QUERY_SUMMARY_MAP_GROUP_SIZE:10}
docket.ai.query.max-chunks-per-document=${AI_QUERY_MAX_CHUNKS_PER_DOCUMENT:3}
docket.ai.query.max-summary-sources=${AI_QUERY_MAX_SUMMARY_SOURCES:3}
docket.ai.chunking.tokens-per-chunk=${AI_CHUNKING_TOKENS_PER_CHUNK:500}
docket.ai.chunking.overlap-tokens=${AI_CHUNKING_OVERLAP_TOKENS:50}
docket.ai.chunking.max-atomic-table-tokens=${AI_CHUNKING_MAX_ATOMIC_TABLE_TOKENS:1000}
docket.ai.hybrid.candidates-per-search=${AI_HYBRID_CANDIDATES_PER_SEARCH:30}
docket.ai.hybrid.rrf-k=${AI_HYBRID_RRF_K:60}
docket.ai.hybrid.min-identifier-length=${AI_HYBRID_MIN_IDENTIFIER_LENGTH:3}
docket.ai.hybrid.min-digits-only-identifier-length=${AI_HYBRID_MIN_DIGITS_ONLY_IDENTIFIER_LENGTH:5}
docket.ai.summary.single-pass-chars=${AI_SUMMARY_SINGLE_PASS_CHARS:48000}
docket.ai.summary.map-group-size=${AI_SUMMARY_MAP_GROUP_SIZE:10}
docket.ai.summary.max-chunks=${AI_SUMMARY_MAX_CHUNKS:200}
docket.ai.summary.max-length=${AI_SUMMARY_MAX_LENGTH:2000}
docket.ai.summary.max-key-points=${AI_SUMMARY_MAX_KEY_POINTS:7}
docket.ai.summary.max-key-point-length=${AI_SUMMARY_MAX_KEY_POINT_LENGTH:300}
docket.ai.embedding-batch.max-batch-size=${AI_EMBEDDING_MAX_BATCH_SIZE:250}
docket.ai.embedding-batch.max-batch-chars=${AI_EMBEDDING_MAX_BATCH_CHARS:15000}
docket.ai.embedding-batch.max-retries=${AI_EMBEDDING_MAX_RETRIES:3}
docket.ai.rate-limit.max-requests=${AI_RATE_LIMIT_MAX_REQUESTS:10}
docket.ai.rate-limit.window-millis=${AI_RATE_LIMIT_WINDOW_MILLIS:60000}
docket.ai.rewrite.max-rewrite-length=${AI_REWRITE_MAX_LENGTH:1000}

# Platform & Governance Limits
docket.platform.archive.max-bulk=${ARCHIVE_MAX_BULK:100}
docket.platform.audit.max-page-size=${AUDIT_MAX_PAGE_SIZE:100}
docket.platform.audit.export-batch-size=${AUDIT_EXPORT_BATCH_SIZE:1000}
docket.platform.search.min-query-length=${SEARCH_MIN_QUERY_LENGTH:2}
docket.platform.search.max-query-length=${SEARCH_MAX_QUERY_LENGTH:200}
docket.platform.search.max-page-size=${SEARCH_MAX_PAGE_SIZE:50}
docket.platform.trash.max-page-size=${TRASH_MAX_PAGE_SIZE:100}
docket.platform.trash.empty-batch-size=${TRASH_EMPTY_BATCH_SIZE:1000}
docket.platform.email.batch-size=${EMAIL_BATCH_SIZE:20}
docket.platform.email.lease-minutes=${EMAIL_LEASE_MINUTES:5}
docket.platform.email.max-attempts=${EMAIL_MAX_ATTEMPTS:6}
docket.platform.legal-hold.search-page-size=${LEGAL_HOLD_SEARCH_PAGE_SIZE:200}
docket.platform.legal-hold.max-search-documents=${LEGAL_HOLD_MAX_SEARCH_DOCUMENTS:10000}
docket.platform.retention.max-reason-length=${RETENTION_MAX_REASON_LENGTH:500}
docket.platform.retention.expiring-list-size=${RETENTION_EXPIRING_LIST_SIZE:20}
docket.platform.notification.digest-lines=${NOTIFICATION_DIGEST_LINES:10}
