# Production profile: activated with SPRING_PROFILES_ACTIVE=prod

# Flyway manages schema migrations — never let Hibernate auto-modify the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway is enabled by default via classpath, but be explicit
spring.flyway.enabled=true

# Production logging: less noise, more signal
logging.level.root=WARN
logging.level.com.docket=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
