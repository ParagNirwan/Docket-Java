apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: europe-west3-docker.pkg.dev/docket-java/docket/backend
    newTag: latest
  - name: europe-west3-docker.pkg.dev/docket-java/docket/frontend
    newTag: latest

patches:
  # Two backends minimum in production, so a node upgrade or a crash never leaves zero
  # pods serving, and the PodDisruptionBudget has something to protect.
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
