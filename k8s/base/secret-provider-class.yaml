apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: docket-secrets-provider
  namespace: docket
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/docket-java/secrets/jwt-secret/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/docket-java/secrets/spring-datasource-password/versions/latest"
        path: "SPRING_DATASOURCE_PASSWORD"
      - resourceName: "projects/docket-java/secrets/resend-api-key/versions/latest"
        path: "RESEND_API_KEY"
