services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: docket-java-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docketdb
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docket_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docketdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: docket-java-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docketdb
      SPRING_DATASOURCE_USERNAME: docket
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-docket_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # Requests arrive through the frontend's nginx
      TRUSTED_PROXY_HOPS: "1"
      APP_BASE_URL: http://localhost
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: Docket <no-reply@docket.local>
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Catches all outgoing email locally. Read it at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.29
    container_name: docket-java-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docket-java-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
